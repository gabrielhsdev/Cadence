name: verify

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts skips the Electron / better-sqlite3 native rebuild
      # (postinstall). The verify gate — lint, typecheck, scheduler + CSV tests —
      # is pure JS/TS and needs no native module, so this stays fast and reliable.
      # The SQLite-backed suite (npm run test:db) rebuilds native modules and is
      # run manually before a release, matching the pre-push hook.
      - run: npm ci --ignore-scripts

      - run: npm run verify
